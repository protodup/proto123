[workspace]
resolver = "3"
members = [
    "crates/proto123-coord",
    "crates/proto123-value",
    "crates/proto123-theme",
    "crates/proto123-formula",
    "crates/proto123-model",
    "crates/proto123-calc",
    "crates/proto123-ops",
    "crates/proto123-engine",
    "crates/proto123-tui",
    "crates/proto123-testkit",
    "apps/proto123-wasm",
    "apps/proto123-term",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ratatui = { version = "0.30", default-features = false }
unicode-width = "0.2"
ratzilla = "0.3"
wasm-bindgen = "0.2"
crossterm = "0.29"
cargo_metadata = "0.19"
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
panic = "unwind"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
